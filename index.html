<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Baustellen, Verkehrsmeldungen, Ladesäulen und Lkw-Parkplätze der Autobahn GmbH live auf einer Karte." />
    <meta name="theme-color" content="#1d5ea8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%231d5ea8'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='none' stroke='white' stroke-width='1.5'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
    <title>Autobahn Live Map</title>
  </head>
  <body>
    <div id="map" role="region" aria-label="Karte der deutschen Autobahnen"></div>

    <header class="hud" id="hud">
      <div class="brand">
        <span class="brand-sign" aria-hidden="true">A</span>
        <div>
          <h1>Autobahn Live Map</h1>
          <p class="brand-sub">Offene Verkehrsdaten der Autobahn GmbH</p>
        </div>
        <button id="hud-toggle" class="hud-toggle" type="button" aria-expanded="false" aria-controls="status">Ebenen</button>
      </div>
      <div class="hud-tools">
        <div id="filter" class="filter-host"></div>
        <button id="stats-button" class="stats-button" type="button" aria-pressed="false" aria-controls="panel">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M2.5 13.5h11M4.5 11V7M8 11V3.5M11.5 11V8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span>Statistik</span>
        </button>
      </div>
      <section id="status" class="status" aria-live="polite"></section>
    </header>

    <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
      <button class="panel-close" id="panel-close" type="button" aria-label="Details schließen">×</button>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <noscript>Diese Karte braucht JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
